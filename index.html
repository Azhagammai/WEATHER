<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #83a4d4, #b6fbff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .weather-card {
      max-width: 400px;
      width: 100%;
      padding: 20px;
      border-radius: 15px;
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    #weatherIcon {
      width: 80px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="weather-card text-center">
  <h3 class="mb-3">🌤️ Weather App</h3>
  <input type="text" id="cityInput" class="form-control mb-3" placeholder="Enter city name" />
  <button onclick="getWeather()" class="btn btn-primary w-100">Get Weather</button>

  <div id="weatherResult" class="mt-4" style="display:none;">
    <img id="weatherIcon" src="" alt="Weather Icon" />
    <h4 id="cityName"></h4>
    <p><strong>Temperature:</strong> <span id="temp"></span>°C</p>
    <p><strong>Humidity:</strong> <span id="humidity"></span>%</p>
    <p><strong>Condition:</strong> <span id="description"></span></p>
  </div>
</div>

<script>
  async function getWeather() {
    const city = document.getElementById("cityInput").value;
    const apiKey = "c05c9b12c169d458e39d05b7107c8930";
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error("City not found");

      const data = await response.json();
      document.getElementById("cityName").textContent = data.name;
      document.getElementById("temp").textContent = data.main.temp;
      document.getElementById("humidity").textContent = data.main.humidity;
      document.getElementById("description").textContent = data.weather[0].description;

      const iconCode = data.weather[0].icon;
      const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
      document.getElementById("weatherIcon").src = iconUrl;

      document.getElementById("weatherResult").style.display = "block";
    } catch (error) {
      alert("Error: " + error.message);
    }
  }
</script>

</body>
</html>
